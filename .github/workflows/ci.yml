name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies are installed on purpose: check.py uses only the standard
      # library, so CI runs exactly the command a contributor runs locally.
      - name: Repository checks
        run: python3 scripts/check.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests
